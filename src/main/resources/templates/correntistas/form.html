<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Novo correntista')}"></head>
<body class="bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/header :: header}"></header>

<main id="conteudo-principal" class="mx-auto w-full max-w-2xl px-4 py-8 sm:px-6 lg:py-10">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <a th:href="@{/correntistas}"
       class="inline-flex items-center gap-2 rounded-lg text-sm font-semibold text-slate-600 transition hover:text-emerald-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700">
        <span aria-hidden="true">←</span>
        Voltar para correntistas
    </a>

    <div class="mt-5">
        <p class="text-sm font-semibold uppercase tracking-[0.14em] text-emerald-700">Novo acesso</p>
        <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-950">Cadastrar correntista</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600">Informe os dados que serão usados pelo correntista para acessar o SpendWise.</p>
    </div>

    <form th:action="@{/correntistas/save}"
          th:object="${correntista}"
          method="post"
          class="mt-7 space-y-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
        <div>
            <label for="nome" class="mb-1.5 block text-sm font-semibold text-slate-800">Nome completo</label>
            <input id="nome"
                   th:field="*{nome}"
                   type="text"
                   autocomplete="name"
                   required
                   placeholder="Ex.: Ana Rita"
                   class="min-h-11 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-950 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100">
        </div>

        <div>
            <label for="login" class="mb-1.5 block text-sm font-semibold text-slate-800">Login</label>
            <input id="login"
                   th:field="*{login}"
                   type="text"
                   autocomplete="username"
                   required
                   aria-describedby="login-ajuda"
                   placeholder="Ex.: ana.rita"
                   class="min-h-11 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-950 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100">
            <p id="login-ajuda" class="mt-1.5 text-xs leading-5 text-slate-500">O login precisa ser único no sistema.</p>
        </div>

        <div>
            <label for="senha" class="mb-1.5 block text-sm font-semibold text-slate-800">Senha inicial</label>
            <input id="senha"
                   th:field="*{senha}"
                   type="password"
                   autocomplete="new-password"
                   required
                   aria-describedby="senha-ajuda"
                   placeholder="Defina uma senha"
                   class="min-h-11 w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-950 placeholder:text-slate-400 transition hover:border-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100">
            <p id="senha-ajuda" class="mt-1.5 text-xs leading-5 text-slate-500">Compartilhe esta senha com o correntista após o cadastro.</p>
        </div>

        <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:justify-end">
            <a th:href="@{/correntistas}"
               class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700">
                Cancelar
            </a>
            <button type="submit"
                    class="inline-flex min-h-11 items-center justify-center rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700">
                Salvar correntista
            </button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
