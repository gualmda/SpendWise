<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Novo correntista')}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/header :: header}"></header>
<main class="mx-auto max-w-2xl px-4 py-8">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>
    <h1 class="mb-6 text-2xl font-semibold">Novo correntista</h1>

    <form th:action="@{/correntistas/save}" th:object="${correntista}" method="post"
          class="space-y-5 rounded-lg border border-slate-200 bg-white p-6">
        <div>
            <label class="mb-1 block text-sm font-medium">Nome</label>
            <input th:field="*{nome}" class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Login</label>
            <input th:field="*{login}" class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Senha</label>
            <input th:field="*{senha}" type="password" class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>
        <div class="flex gap-3">
            <button class="rounded-md bg-emerald-700 px-4 py-2 text-white hover:bg-emerald-800">Salvar</button>
            <a th:href="@{/correntistas}" class="rounded-md border border-slate-300 px-4 py-2">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
