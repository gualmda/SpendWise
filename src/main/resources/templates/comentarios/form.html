<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${edicao ? 'Editar comentário' : 'Adicionar comentário'})}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/header :: header}"></header>
<main class="mx-auto max-w-2xl px-4 py-8">
    <h1 class="text-2xl font-semibold" th:text="${edicao ? 'Editar comentário' : 'Adicionar comentário'}"></h1>
    <p class="mb-6 mt-1 text-sm text-slate-500" th:text="${transacao.descricao}"></p>

    <form th:action="${edicao} ? @{/comentarios/update} : @{/comentarios/save}"
          th:object="${comentario}" method="post"
          class="space-y-5 rounded-lg border border-slate-200 bg-white p-6">
        <input th:if="${edicao}" type="hidden" th:field="*{id}">
        <input type="hidden" name="transacaoId" th:value="${transacaoId}">
        <div>
            <label class="mb-1 block text-sm font-medium">Comentário</label>
            <textarea th:field="*{texto}" rows="6"
                      class="w-full rounded-md border border-slate-300 px-3 py-2"></textarea>
        </div>
        <div class="flex gap-3">
            <button class="rounded-md bg-emerald-700 px-4 py-2 text-white hover:bg-emerald-800">Salvar</button>
            <a th:href="@{/contas}" class="rounded-md border border-slate-300 px-4 py-2">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
