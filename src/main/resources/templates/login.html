<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Login')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10">
    <div class="w-full rounded-xl border border-slate-200 bg-white p-7 shadow-sm">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold text-emerald-700">SpendWise</h1>
            <p class="mt-1 text-sm text-slate-500">Entre para acessar suas contas.</p>
        </div>

        <div th:if="${erro}" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
             th:text="${erro}"></div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label for="login" class="mb-1 block text-sm font-medium">Login</label>
                <input id="login" name="login" th:value="${loginInformado}"
                       class="w-full rounded-md border border-slate-300 px-3 py-2" autofocus>
            </div>
            <div>
                <label for="senha" class="mb-1 block text-sm font-medium">Senha</label>
                <input id="senha" name="senha" type="password"
                       class="w-full rounded-md border border-slate-300 px-3 py-2">
            </div>
            <button class="w-full rounded-md bg-emerald-700 px-4 py-2 font-medium text-white hover:bg-emerald-800">
                Entrar
            </button>
        </form>

        <div class="mt-6 rounded-md bg-slate-50 p-3 text-xs text-slate-500">
            Administrador inicial: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>
</main>
</body>
</html>
