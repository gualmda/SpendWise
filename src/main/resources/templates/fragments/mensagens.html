<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="mensagens" class="mb-6 space-y-3" aria-live="polite" aria-atomic="true">
    <div th:if="${mensagem}"
         role="status"
         class="flex items-start gap-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3.5 text-sm text-emerald-900 shadow-sm">
        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emerald-700 text-xs font-bold text-white" aria-hidden="true">✓</span>
        <span th:text="${mensagem}"></span>
    </div>
    <div th:if="${erro}"
         role="alert"
         class="flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3.5 text-sm text-red-900 shadow-sm">
        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-red-700 text-xs font-bold text-white" aria-hidden="true">!</span>
        <span th:text="${erro}"></span>
    </div>
</div>
</body>
</html>
