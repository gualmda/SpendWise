<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Nova conta')}"></head>
<body class="bg-slate-50 text-slate-900">
<header th:replace="~{fragments/header :: header}"></header>
<main class="mx-auto max-w-2xl px-4 py-8">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>
    <h1 class="mb-6 text-2xl font-semibold">Nova conta</h1>

    <form th:action="@{/contas/save}" th:object="${conta}" method="post"
          class="space-y-5 rounded-lg border border-slate-200 bg-white p-6">
        <div>
            <label class="mb-1 block text-sm font-medium">Número</label>
            <input th:field="*{numero}" class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Descrição</label>
            <input th:field="*{descricao}" class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Tipo</label>
            <select th:field="*{tipo}" class="w-full rounded-md border border-slate-300 px-3 py-2">
                <option value="">Selecione</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div>
            <label class="mb-1 block text-sm font-medium">Dia do fechamento (cartão)</label>
            <input th:field="*{diaFechamento}" type="number"
                   class="w-full rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div th:if="${admin}">
            <label class="mb-1 block text-sm font-medium">Correntista</label>
            <select name="correntistaId" class="w-full rounded-md border border-slate-300 px-3 py-2">
                <option value="">Selecione</option>
                <option th:each="c : ${correntistas}"
                        th:value="${c.id}"
                        th:text="${c.nome + ' (' + c.login + ')'}"
                        th:selected="${c.id == correntistaId}"></option>
            </select>
        </div>

        <div th:if="${!admin}" class="rounded-md bg-slate-50 px-4 py-3 text-sm text-slate-600">
            A conta será cadastrada para <strong th:text="${usuario.nome}">correntista</strong>.
        </div>

        <div class="flex gap-3">
            <button class="rounded-md bg-emerald-700 px-4 py-2 text-white hover:bg-emerald-800">Salvar</button>
            <a th:href="@{/contas}" class="rounded-md border border-slate-300 px-4 py-2">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
